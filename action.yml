name: 'Deploy to Amplify (AWS CLI)'
description: 'Deploy a ZIP artifact to AWS Amplify using AWS CLI'
inputs:
  app-id:
    description: 'Amplify application ID'
    required: true
  branch:
    description: 'Branch name'
    required: false
    default: 'main'
  zip-path:
    description: 'Path to the .zip file to deploy'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Create and Start Deployment
      shell: bash
      env:
        INPUT_APP_ID: ${{ inputs.app-id }}
        INPUT_BRANCH: ${{ inputs.branch }}
        INPUT_ZIP_PATH: ${{ inputs.zip-path }}
      run: bash ${{ github.action_path }}/deploy.sh

branding:
  icon: 'upload-cloud'
  color: 'orange'