name: 'Deploy to Amplify'
description: 'Deploy a ZIP artifact to AWS Amplify using the AWS SDK'
inputs:
  app-id:
    description: 'Amplify application ID'
    required: true
  branch:
    description: 'Branch name'
    required: false
    default: 'main'
  zip-path:
    description: 'Path to the .zip file to deploy'
    required: true
outputs:
  job-id:
    description: 'Amplify deployment job ID'

runs:
  using: 'node24'
  main: 'dist/index.js'

branding:
  icon: 'upload-cloud'
  color: 'orange'
